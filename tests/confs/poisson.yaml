expname: poisson-tests-app

defaults:
  - base_hydra_config
  - _self_


# customization follows
gridstates:
  Nx_lvl: 128  # grid for level-set
  Ny_lvl: 128 # grid for level-set
  Nz_lvl: 128 # grid for level-set
  Nx_eval: 128  # grid for evaluation/visualization
  Ny_eval: 128  # grid for evaluation/visualization
  Nz_eval: 128  # grid for evaluation/visualization

solver:
  Nx_tr: 64 # grid for training
  Ny_tr: 64 # grid for training
  Nz_tr: 64 # grid for training
  num_epochs: 10000 # number of epochs to train
  batch_size: 262144
  print_rate: 1000 # frequency of printing epochs and loss during training
  restart_from_checkpoint: false # whether to restart from an existing checkpoint
  restart_checkpoint_dir: /workspace/results/poisson-tests-app-2023-07-22-20-17-41/no_jump/checkpoints/
  algorithm: 0  # 0: regression normal derivatives, 1: neural network normal derivatives

  train_omega_minus_only: true
  
  robin_weight_length: 1.0

  alternate_tets: true

  # Jump problems only (sphere, star, sphere_jaxrobin, star_jaxrobin).
  jump_scheme: original  # original: rules as published, rows / diagonal; fixed: corrected rules (tools/jump_replica3d.py), Bias Slow, interface weights
  jump_ell: 1.0e4        # fixed scheme: row weight sqrt(h^3 + jump_ell * (max(A_Gamma, jump_cut_floor h^2) + A_ghost))
  jump_cut_floor: 0.05
  jump_eval_once: false  # true: evaluate the network once per grid node (same rows, ~200x less memory)
  # Hybrid training: after the optimizer, solve the output layers (w, b of u- and u+) exactly by least
  # squares on the same rows, hidden layers fixed (Trainer.solve_last_layer, tools/jump_last_layer_ls.py).
  last_layer_ls: false
  last_layer_ls_rcond: 1.0e-6  # keep singular values above this times the largest (float32 resolves ~1e-7)
  last_layer_ls_refine: 1      # iterative-refinement steps after the solve (same factorisation)
  last_layer_ls_columns: 1     # columns of the solve's matrix computed together (raise on a large GPU)

  use_float64: false
  multi_gpu: false
  num_gpus_ddp: 2
  optim:
    optimizer_name: "adamw" # options are "custom", "adam", "rmsprop"
    learning_rate: 1e-3
    eps: 1.0e-16 
    weight_decay: 0.0
  sched:
    scheduler_name: "cosine" # options are "exponential", "polynomial", "cosine", "constant"
    decay_rate: 0.985 # only used by "exponential"
    transition_steps: null # null => anneal over the full run (num_epochs * batches_per_epoch)
  data_manager:
    refine: false
    refine_normals: false # if true will add extra points by moving grid points iteratively along minus normal of level-set function
    refine_lod: false # if true will add extra points by Octree using Kaolin

experiment:
  results_path: "" # name of folder inside ${hydra:run.dir}
  sphere: true # sphere interface with jump conditions
  star: false # star interface with jump conditions
  no_jump: false # no interface and no jump conditions (used to be true)
  sphere_Robin: false # sphere with Robin B.C
  star_Robin: false
  star_Robin3: false
  star_Robin2: false # the star of the JAX-DIPS paper (section 4.3), sphere_Robin's problem otherwise
  sphere_jaxrobin: false # jump sphere with JAX-Robin's radius 2/3
  star_jaxrobin: false # jump star's data on JAX-Robin's star (corrected f- and unit-normal beta)


  logging:
    checkpoint_interval: 250
    log_dir: ${hydra:runtime.output_dir}
    currDir: ${hydra:runtime.cwd}
    checkpoint_dir: ${hydra:runtime.cwd}/checkpoints

model:
  name: null
  model_type: "mlp"
  mlp:
    hidden_layers_m: 2
    hidden_dim_m: 100
    activation_m: "jnp.tanh"
    hidden_layers_p: 2
    hidden_dim_p: 100
    activation_p: "jnp.tanh"
    init_std_m: 0.1  # standard deviation of the hidden layers' initial weights
    init_std_p: 0.1
    bias_range_m: 0.0  # hidden-layer biases uniform in [-r, r]; 0 = zeros (use 3.14159 with jnp.sin)
    bias_range_p: 0.0
  resnet:
    res_blocks_m: 3
    res_dim_m: 40
    activation_m: "jnp.tanh"
    res_blocks_p: 0
    res_dim_p: 0
    activation_p: "jnp.tanh"
