expname: poisson-tests-app

defaults:
  - base_hydra_config
  - _self_


# customization follows
gridstates:
  Nx_lvl: 128  # grid for level-set
  Ny_lvl: 128 # grid for level-set
  Nz_lvl: 128 # grid for level-set
  Nx_eval: 128  # grid for evaluation/visualization
  Ny_eval: 128  # grid for evaluation/visualization
  Nz_eval: 128  # grid for evaluation/visualization

solver:
  Nx_tr: 64 # grid for training
  Ny_tr: 64 # grid for training
  Nz_tr: 64 # grid for training
  num_epochs: 10000 # number of epochs to train
  batch_size: 262144
  print_rate: 1000 # frequency of printing epochs and loss during training
  restart_from_checkpoint: false # whether to restart from an existing checkpoint
  restart_checkpoint_dir: /workspace/results/poisson-tests-app-2023-07-22-20-17-41/no_jump/checkpoints/
  algorithm: 0  # 0: regression normal derivatives, 1: neural network normal derivatives
  # Robin only: drop training points with phi > 0. Those points form equations that
  # only touch the Omega+ network, which cannot affect the Omega--masked error, so
  # they add an irreducible constant to the loss and cost compute for nothing.
  # Side effect: Omega+ is left untrained, so U outside the interface is meaningless.
  train_omega_minus_only: true
  # Run the entire solver in float64 rather than float32. Read at import time by the
  # precision block at the top of tests/test_poisson.py; override per run without
  # editing this file via `solver.use_float64=false` on the command line.
  #
  # WHY: the FV stencils divide by dx^2, so their float roundoff grows as 4*eps/dx^2
  # while truncation error falls as dx. In float32 (eps = 5.96e-08) the two cross at
  # dx ~ 0.04. The [-2.1,2.1] box at Nx=64 gives dx = 0.0667, safely above it; the
  # normalised [-1,1] box at Nx=64 gives dx = 0.0317, inside the band -- and that is
  # exactly where Star's error turned UPWARD (2.28e-03 at Nx=32 to 2.69e-03 at Nx=64)
  # while the sphere, whose error is smaller, kept falling. float64 moves the crossover
  # to dx ~ 2.7e-04, out of reach of any grid used here, so it isolates roundoff from
  # the other floors: it does NOT touch FV truncation, the O(dx^2) error in the finite
  # difference normals, the non-SDF error in d = phi/|grad phi|, or the network's own
  # approximation error. If the Star turnover survives float64, roundoff is not the
  # cause.
  #
  # COST: float64 runs at about half of float32 throughput on datacenter GPUs and
  # 1/32 to 1/64 on consumer cards, so expect 2x to 60x slower, and 2x the memory.
  use_float64: false
  multi_gpu: false
  num_gpus_ddp: 2
  optim:
    optimizer_name: "adamw" # options are "custom", "adam", "rmsprop"
    learning_rate: 1e-3
    # Adam's denominator epsilon. optax defaults to 1e-8, which is LARGER than the
    # gradient norms this loss produces at fine resolution (the preconditioned residual's
    # sensitivity to the solution error carries dx^3), so Adam stalls at an error floor
    # that grows like dx^-3. Keep this far below the smallest gradient you expect.
    eps: 1.0e-16 # NB: written with the decimal point so plain YAML parses it as a float
    # adamw's decoupled weight decay. Adam normalizes its gradient term to O(1), so the
    # fixed point m_hat/sqrt(v_hat) = -wd*theta contains no grid spacing at all: this sets
    # an error floor that is the SAME at every resolution. Set to 0.0 to remove it.
    weight_decay: 0.0
  sched:
    scheduler_name: "cosine" # options are "exponential", "polynomial", "cosine", "constant"
    decay_rate: 0.985 # only used by "exponential"
    transition_steps: null # null => anneal over the full run (num_epochs * batches_per_epoch)
  data_manager:
    refine: false
    refine_normals: false # if true will add extra points by moving grid points iteratively along minus normal of level-set function
    refine_lod: false # if true will add extra points by Octree using Kaolin

experiment:
  results_path: "" # name of folder inside ${hydra:run.dir}
  sphere: false # sphere interface with jump conditions
  star: false # star interface with jump conditions
  no_jump: false # no interface and no jump conditions (used to be true)
  sphere_Robin: true # sphere with Robin B.C
  star_Robin: true
  star_Robin3: true


  logging:
    checkpoint_interval: 250
    log_dir: ${hydra:runtime.output_dir}
    currDir: ${hydra:runtime.cwd}
    checkpoint_dir: ${hydra:runtime.cwd}/checkpoints

model:
  name: null
  model_type: "mlp"
  mlp:
    hidden_layers_m: 2
    hidden_dim_m: 100
    activation_m: "jnp.tanh"
    hidden_layers_p: 0
    hidden_dim_p: 0
    activation_p: "jnp.tanh"
  resnet:
    res_blocks_m: 3
    res_dim_m: 40
    activation_m: "jnp.tanh"
    res_blocks_p: 0
    res_dim_p: 0
    activation_p: "jnp.tanh"
